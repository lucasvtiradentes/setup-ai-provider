name: 'setup-ai-provider'
description: 'Install, authenticate, and collect session files for AI provider CLIs'
author: 'lucasvtiradentes'

branding:
  icon: 'cpu'
  color: 'blue'

inputs:
  # Step 1: select provider.
  provider:
    description: 'AI provider to setup: claude, codex, or gemini'
    required: true
  additional-consumers:
    description: 'Comma-separated extra tools to configure from the selected provider auth, e.g. pi'
    required: false
    default: ''

  # Step 2: setup provider auth.
  claude-code-oauth-token:
    description: 'Claude Code OAuth token'
    required: false
  codex-auth-json:
    description: 'Content for ~/.codex/auth.json'
    required: false
  gemini-auth-json:
    description: 'Content for ~/.gemini/oauth_creds.json'
    required: false

  # Step 3: upload provider session artifact.
  session-files-path:
    description: 'Temporary path used during post-step session upload'
    required: false
    default: 'provider-session-files'
  upload-session-files:
    description: 'Upload collected provider session files as a workflow artifact'
    required: false
    default: 'false'
  artifact-name:
    description: 'Artifact name for uploaded session files'
    required: false
    default: ''
  retention-days:
    description: 'Artifact retention days'
    required: false
    default: '7'

runs:
  using: 'node24'
  main: 'dist/index.js'
  post: 'dist/cleanup.js'
  post-if: 'always()'
